<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Enko Clues — the launcher/store mark (enko/store/icon.svg, commit c6edd37 + fd46e42):
       a gold maze around a parchment ENKO plaque on dark lapis. It REPLACED the old purple
       meridian sphere; keep this file a byte-faithful copy of the app's own icon.svg. -->
  <defs>
    <linearGradient id="bg" x1="54" y1="108" x2="54" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050D1F"/>
      <stop offset="0.5" stop-color="#0D1330"/>
      <stop offset="1" stop-color="#1A0D2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="54" cy="52" r="46" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C2547"/>
      <stop offset="1" stop-color="#1C2547" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldRing" x1="32" y1="32" x2="76" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6CB85"/>
      <stop offset="0.55" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#8F6F2A"/>
    </linearGradient>
    <linearGradient id="plaqueGold" x1="33" y1="44" x2="75" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E6CB85"/>
      <stop offset="0.55" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#8F6F2A"/>
    </linearGradient>
    <linearGradient id="parchment" x1="54" y1="45.8" x2="54" y2="62.2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5EBD6"/>
      <stop offset="1" stop-color="#E8D9B8"/>
    </linearGradient>
  </defs>

  <rect width="108" height="108" fill="url(#bg)"/>
  <circle cx="54" cy="52" r="46" fill="url(#glow)"/>

  <g transform="translate(54,54) scale(1.28) translate(-54,-54)">

    <!-- Maze rings, offset entrance gaps -->
    <path d="M50,76 H32 V32 H76 V76 H58" fill="none" stroke="url(#goldRing)" stroke-width="2"/>
    <path d="M50,37 H37 V71 H71 V37 H58" fill="none" stroke="#C9A24B" stroke-width="2"/>
    <path d="M50,66 H42 V42 H66 V66 H58" fill="none" stroke="#8F6F2A" stroke-width="2"/>

    <!-- Corridor walls, top band -->
    <g fill="none" stroke="#C9A24B" stroke-width="2">
      <path d="M40,32 V37"/>
      <path d="M52,32 V37"/>
      <path d="M66,32 V37"/>
    </g>
    <g fill="none" stroke="#8F6F2A" stroke-width="2">
      <path d="M46,37 V42"/>
      <path d="M60,37 V42"/>
    </g>

    <!-- Corridor walls, bottom band -->
    <g fill="none" stroke="#C9A24B" stroke-width="2">
      <path d="M42,76 V71"/>
      <path d="M54,76 V71"/>
      <path d="M66,76 V71"/>
    </g>
    <g fill="none" stroke="#8F6F2A" stroke-width="2">
      <path d="M48,71 V66"/>
      <path d="M62,71 V66"/>
    </g>

    <!-- Side wall stubs -->
    <g fill="none" stroke="#C9A24B" stroke-width="2">
      <path d="M32,42 H37"/>
      <path d="M76,62 H71"/>
    </g>

    <!-- Tilted parchment plaque -->
    <g transform="rotate(-3.5 54 54)">
      <path d="M37.5,45.5 H73.5 A3,3 0 0 1 76.5,48.5 V62.5 A3,3 0 0 1 73.5,65.5 H37.5 A3,3 0 0 1 34.5,62.5 V48.5 A3,3 0 0 1 37.5,45.5 Z" fill="#060E22" fill-opacity="0.55"/>
      <path d="M36,44 H72 A3,3 0 0 1 75,47 V61 A3,3 0 0 1 72,64 H36 A3,3 0 0 1 33,61 V47 A3,3 0 0 1 36,44 Z" fill="url(#plaqueGold)"/>
      <path d="M36.6,45.8 H71.4 A1.8,1.8 0 0 1 73.2,47.6 V60.4 A1.8,1.8 0 0 1 71.4,62.2 H36.6 A1.8,1.8 0 0 1 34.8,60.4 V47.6 A1.8,1.8 0 0 1 36.6,45.8 Z" fill="url(#parchment)"/>

      <!-- ENKO in ink -->
      <g fill="none" stroke="#2A1F18" stroke-width="2">
        <path d="M42.5,49.5 H36.5 V58.5 H42.5"/>
        <path d="M36.5,54 H41"/>
        <path d="M46,58.5 V49.5 L52.5,58.5 V49.5"/>
        <path d="M55.5,49.5 V58.5"/>
        <path d="M61.5,49.5 L56.5,54 L61.5,58.5"/>
        <path d="M65,54 A3.25,4.5 0 1 1 71.5,54 A3.25,4.5 0 1 1 65,54 Z"/>
      </g>
    </g>
  </g>
</svg>
