<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ygar Solitaire app icon">
  <!--
    Same mark as the app's launcher art: solitaire/docs/store/icon.svg
    (deep table green #0F3D33, gold studio rule #D4A832, a paper Ace card
    tilted -8deg with the gold spade motif). Geometry copied verbatim; only
    the rounded-corner clip and the accessibility labels are added so it sits
    next to igi-icon.svg / enko-icon.svg on the site.
  -->
  <defs>
    <clipPath id="solClip"><rect x="0" y="0" width="512" height="512" rx="96"/></clipPath>
  </defs>

  <g clip-path="url(#solClip)">
    <rect width="512" height="512" rx="96" fill="#0F3D33"/>
    <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#D4A832" stroke-width="6" opacity="0.55"/>
    <g transform="rotate(-8 256 256)">
      <rect x="146" y="106" width="220" height="300" rx="24" fill="#F6F1E6"/>
      <path d="M256 168c-30 44-62 62-62 96 0 26 20 44 44 44 6 0 12-1 18-4-4 18-12 30-24 40h48c-12-10-20-22-24-40 6 3 12 4 18 4 24 0 44-18 44-44 0-34-32-52-62-96z" fill="#D4A832"/>
      <text x="176" y="160" font-family="'Noto Sans',system-ui,sans-serif" font-weight="bold" font-size="44" fill="#1E2126">A</text>
    </g>
  </g>
</svg>
