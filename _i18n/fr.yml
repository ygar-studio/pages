citytransport:
  page_title: "City Transport"
  label: "Stratégie · Android"
  tagline1: "Tracez les lignes. Faites circuler la ville."
  tagline2: "Un puzzle minimaliste de réseau de transport."
  cta: "Télécharger sur Google Play"
  about_label: "L'idée"
  about_title: "Toutes les lignes naissent égales — quelques-unes passent en Express"
  about_body1: >
    Les stations poussent dans une vraie ville et les voyageurs s'accumulent, chacun voulant une
    station à la forme de sa destination. Vous tracez les lignes, y placez des trains et acheminez
    la foule. Une station saturée au-delà de son délai met fin à la partie ; atteindre l'objectif
    de voyageurs gagne le niveau sur-le-champ.
  about_body2: >
    Le choix qui décide d'une partie, c'est quelle ligne obtient l'upgrade Express — plus rapide,
    plus capacitaire, dessinée dans un habillage rayé noir et jaune. Les emplacements Express sont
    rares : un seul jusqu'aux niveaux moyens, deux sur les plus durs. Alimentez la ligne améliorée
    avec le reste du réseau, et transformez une station chargée en hub pour fluidifier les
    correspondances.
  feat_label: "Le jeu"
  feat_title: "Pensé pour se lire d'un coup d'œil"
  feat1_title: "Une campagne de 20 villes"
  feat1_body: "De Lyon à Tokyo, chaque ville avec sa géographie, son eau et sa difficulté croissante. Chaque niveau terminé donne une note de satisfaction du réseau de 1 à 100 — rejouez pour battre votre record."
  feat2_title: "Mode Cartes"
  feat2_body: "12 packs de pays et 117 villes en partie rapide, une course au score sans fin avec un record par ville."
  feat3_title: "À une main, minimaliste"
  feat3_body: "Glissez pour tracer, pincez pour zoomer, appui long pour modifier. Un rendu de plan de transport clair, fait pour des sessions courtes."
  feat4_title: "Hors ligne, six langues"
  feat4_body: "Entièrement jouable hors ligne. Anglais, français, espagnol, allemand, italien et portugais. Sans pub, sans pistage, sans compte."
  maps_label: "Mode Cartes"
  maps_title: "Toute la carte du monde, un pack à la fois"
  maps_body: >
    Cartes, c'est la moitié libre du jeu : choisissez un pack de pays, une ville, et lancez une
    partie sans fin pour le plus grand nombre de voyageurs. 117 villes, chacune avec sa difficulté.
  maps_price: >
    Le Brésil et l'Italie sont offerts, et chaque joueur reçoit deux déblocages gratuits en plus.
    Ensuite, un pack est un petit achat unique, ou vous débloquez tous les packs d'un coup —
    actuels et à venir.

  shots_label: "Captures"
  shot1_alt: "Paris au jour 12 — quatre lignes, une passée en Express dans son habillage noir et jaune, et une satisfaction de réseau à 88."
  shot2_alt: "San Francisco — de l'eau de tous les côtés, et un réseau dessiné par la baie."
  shot3_alt: "Rome — un centre dense traité par trois pôles de correspondance."
  shot4_alt: "La liste de campagne — sept villes terminées, la suivante ouverte, les autres encore verrouillées."
  shot5_alt: "Les packs Maps — le Brésil et l'Italie gratuits d'emblée, les autres à un geste du déblocage."
  store_status: "En test fermé — la fiche Play s'ouvrira à tous une fois la revue passée."
citytransport_privacy:
  label: "Mentions légales"
  title: "Politique de confidentialité"
  meta: "City Transport — Ygar Studio — Dernière mise à jour : septembre 2026"
  intro: >
    City Transport est un jeu solo qui fonctionne hors ligne. Nous ne collectons aucune donnée
    personnelle, n'affichons aucune publicité et n'utilisons aucun outil d'analyse. Le seul trafic
    réseau que le jeu émet de lui-même est celui de Google Play Billing, lorsque vous achetez un
    pack de pays.
  s1_title: "1. Qui nous sommes"
  s1_body: >
    City Transport est édité par Ygar Studio, développeur indépendant.
    Pour toute question relative à la confidentialité, écrivez-nous à
  s2_title: "2. Données que nous ne collectons pas"
  s2_intro: "Ygar Studio ne collecte, ne stocke et ne partage aucun des éléments suivants :"
  s2_li1: "Informations d'identité (nom, e-mail, numéro de téléphone)"
  s2_li2: "Données de localisation"
  s2_li3: "Identifiants d'appareil ou identifiants publicitaires"
  s2_li4: "Statistiques d'usage ou rapports de plantage envoyés vers nos serveurs"
  s2_li5: "Comportement dans l'application ou télémétrie de jeu"
  s3_title: "3. Données stockées sur votre appareil"
  s3_body: >
    Les niveaux terminés et leurs notes de satisfaction, les records du mode Cartes, les packs de
    pays débloqués et vos réglages sont enregistrés
    <strong>uniquement sur votre appareil</strong>, dans le stockage privé de l'application. Si la
    <strong>sauvegarde automatique</strong> d'Android est activée, Android peut en copier une
    sauvegarde sur votre propre compte Google afin de la restaurer après réinstallation — c'est
    géré par Android sous votre compte, et le développeur n'y a jamais accès.
  s4_title: "4. Achats intégrés"
  s4_body: >
    Certains packs de pays du mode Cartes peuvent être débloqués par un achat unique. Les achats
    sont gérés <strong>entièrement par Google Play Billing</strong> : vos données de paiement vont
    à Google, jamais à nous. L'application demande à Google Play quels produits votre compte
    possède, afin de les débloquer à nouveau après une réinstallation ou sur un autre appareil, et
    ne conserve que cette réponse — la liste des packs débloqués — sur votre appareil. Nous ne
    recevons de Google aucune information de paiement ni donnée personnelle, au-delà des rapports
    de ventes agrégés de Play.
  s5_title: "5. Autorisations"
  s5_body: >
    L'application déclare elle-même deux autorisations : <strong>Vibreur</strong>, pour le retour
    haptique en jeu, et <strong>com.android.vending.BILLING</strong>, pour les achats ci-dessus. La
    bibliothèque Google Play Billing ajoute <strong>Internet</strong> et <strong>État du
    réseau</strong> à l'application compilée, car joindre les serveurs de paiement de Play les
    exige. Rien d'autre dans le jeu n'utilise le réseau : aucune donnée de jeu, aucune statistique
    et aucune donnée personnelle n'est jamais transmise.
  s6_title: "6. Confidentialité des enfants"
  s6_body: "City Transport ne collecte pas sciemment de données concernant des enfants de moins de 13 ans. Le jeu ne contient ni contenu généré par les utilisateurs, ni chat, ni publicité, ni compte. Il contient des achats intégrés facultatifs, gérés par Google Play."
  s7_title: "7. Services tiers"
  s7_body: "Le jeu n'intègre aucun SDK d'analyse, réseau publicitaire, service de rapport de plantage ni service cloud. Google Play Billing est le seul service tiers contacté, et uniquement lors d'un achat."
  s8_title: "8. Suppression des données"
  s8_body: "Toutes les données sont locales. Désinstaller l'application efface tout, y compris la copie de sauvegarde automatique, conformément aux règles d'Android. Rien n'est conservé de notre côté, il n'y a donc rien dont demander la suppression."
  s9_title: "9. Contact"

solitaire:
  page_title: "Ygar Solitaire"
  label: "Jeu de cartes · Android"
  tagline1: "Quatre solitaires classiques, une table paisible."
  tagline2: "Annulation illimitée. Un indice loyal. Sans pub, jamais."
  cta: "Disponible sur Google Play"
  hero_note: >
    Touchez une carte pour l'envoyer à sa meilleure place, ou faites-la glisser exactement où
    vous voulez. L'annulation est illimitée, un indice est toujours à portée de doigt, et
    toute main peut être recommencée ou rejouée telle qu'elle a été distribuée.
  variants_label: "Les quatre variantes"
  variants_title: "Un seul moteur, quatre jeux classiques"
  klondike_name: "Klondike"
  klondike_tagline: "Le classique des classiques"
  klondike_body: >
    Montez les quatre fondations de l'As au Roi. Les colonnes vides n'acceptent qu'un Roi, et une
    suite descendante en couleurs alternées se déplace comme un seul bloc.
  klondike_options: "Tirage 1 ou 3 · redonnes illimitées, 3, 1 ou 0"
  spider_name: "Spider"
  spider_tagline: "Huit suites, deux jeux"
  spider_body: >
    Deux jeux de cartes, dix colonnes. Assemblez huit suites Roi-à-As de la même couleur ; seule
    une séquence descendante de même couleur se déplace en groupe.
  spider_options: "1, 2 ou 4 couleurs"
  freecell_name: "FreeCell"
  freecell_tagline: "Toutes les cartes visibles, tous les coups à vous"
  freecell_body: >
    Toutes les cartes sont distribuées face visible dès le départ. Quatre cases libres accueillent
    chacune une carte, et de vrais supermoves déplacent une suite entière d'un coup.
  freecell_options: "Presque toutes les donnes sont gagnables — aucune option à régler"
  pyramid_name: "Pyramide"
  pyramid_tagline: "Des paires qui font treize"
  pyramid_body: >
    Videz la pyramide de 28 cartes en associant des cartes exposées dont la somme fait treize —
    un Roi se retire seul.
  pyramid_options: "2, 1 ou 0 redonnes"
  fair_label: "Des donnes honnêtes"
  fair_title: "Aucun battage truqué, aucune main cachée"
  fair_body1: >
    Tous les mélanges du jeu passent par un seul générateur du moteur, réglé donne par donne.
    Rien n'est arrangé contre vous et rien n'est remélangé dans votre dos — les règles que
    vous voyez sont les seules que le moteur applique.
  fair_body2: >
    Chaque donne étant reproductible, « Rejouer la dernière partie » redistribue exactement la
    main précédente et « Recommencer » remet la partie en cours au coup zéro. « Nouvelle
    partie » en distribue une autre. Rien à saisir, aucun code à retenir.
  feat_label: "Fonctionnalités"
  feat_title: "Pensé avec soin"
  feat1_title: "Annulation illimitée"
  feat1_body: "Revenez sur n'importe quel coup, jusqu'à la donne initiale. Rétablir le ramène aussitôt — gratuit, sans pénalité et sans limite."
  feat2_title: "Un indice toujours honnête"
  feat2_body: "Le bouton Indice montre un coup légal, tiré des mêmes règles que le moteur applique — pas de solveur, pas de pénalité, pas de délai."
  feat3_title: "Fin automatique"
  feat3_body: "Dès que la victoire est certaine, la fin automatique termine la partie en une seule cascade."
  feat4_title: "Vos propres records"
  feat4_body: "Taux de victoire, meilleur temps, coups minimum et séries, suivis séparément pour chaque variante et ses options."
  feat5_title: "Reprend exactement où vous étiez"
  feat5_body: "Fermez l'appli en pleine partie et retrouvez le même plateau, le même historique d'annulation, le même score."
  feat6_title: "Quatre thèmes de table, pensés pour le daltonisme"
  feat6_body: "Choisissez émeraude, marine, bordeaux ou graphite dans les réglages ; les couleurs sont dessinées comme des formes, et un jeu de cartes à quatre couleurs optionnel les distingue encore plus vite."
  free_label: "Ce que ça coûte"
  free_title: "Gratuit. Vraiment gratuit."
  free_body1: >
    Pas de pub, pas d'achat intégré, pas de version payante — jamais. Ygar Solitaire est gratuit
    pour toujours ; l'objectif du studio est un jeu qui mérite votre temps, pas votre portefeuille.
  free_body2: "Pas de compte, pas de connexion, rien à relier. Chaque donne tourne entièrement sur votre appareil."

  shots_label: "Captures"
  shot1_alt: "Une partie de Klondike en cours sur le tapis émeraude, durée, nombre de coups et score en barre haute."
  shot2_alt: "Spider — deux jeux distribués sur dix colonnes."
  shot3_alt: "FreeCell — toutes les cartes face visible dès la donne, quatre cellules libres au-dessus."
  shot4_alt: "Pyramid — videz la pyramide en appariant les cartes visibles dont la somme fait treize."
  shot5_alt: "Le menu — les quatre variantes et le guide."
  shot6_alt: "Réglages — thème de tapis, jeu à quatre couleurs, animations réduites et mode gaucher."
  store_status: "Pas encore sur Google Play — la fiche s'ouvrira à la sortie."
  act_new: "Nouvelle partie"
  act_replay: "Rejouer la dernière partie"
  act_restart: "Recommencer"
