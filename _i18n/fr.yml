  s2_li6: "Caméra, microphone, contacts ou fichiers en dehors du stockage propre à l'application"
  s3_title: "3. Données stockées sur votre appareil"
  s3_body: >
    La progression de jeu — statistiques, réglages, et la partie interrompue avec sa donne exacte — est
    stockée uniquement sur votre appareil, dans le stockage privé de l'application. Elle est
    supprimée lors de la désinstallation ou de l'effacement des données. Elle ne quitte jamais
    votre appareil.
  s4_title: "4. Accès réseau"
  s4_body: "Ygar Solitaire fonctionne entièrement hors ligne et n'effectue aucun appel réseau. L'application ne demande pas la permission Internet."
  s5_title: "5. Autorisations"
  s5_body: >
    L'application déclare une seule autorisation : Vibreur, utilisée uniquement pour le retour
    haptique à la prise, à la pose et sur un coup illégal. Elle ne demande aucune autre
    autorisation — ni localisation, ni stockage, ni réseau.
  s6_title: "6. Confidentialité des enfants"
  s6_body: "Ygar Solitaire ne collecte sciemment aucune donnée d'enfants de moins de 13 ans. L'application ne contient ni publicité, ni achat, ni discussion, ni compte, et convient à tous les âges."
  s7_title: "7. Services tiers"
  s7_body: "Le jeu n'intègre aucun kit d'analyse, aucun réseau publicitaire, aucun service de rapport de plantage ni aucun service cloud."
  s8_title: "8. Modifications de cette politique"
  s8_body: >
    Si une future version change l'un de ces points — une sauvegarde cloud optionnelle, par
    exemple — cette politique sera mise à jour en premier et le changement sera mentionné dans
    les notes de version de l'application.
  s9_title: "9. Contact"
