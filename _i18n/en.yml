citytransport:
  page_title: "City Transport"
  label: "Strategy · Android"
  tagline1: "Draw the lines. Keep the city moving."
  tagline2: "A minimalist transport-network puzzle."
  cta: "Get it on Google Play"
  about_label: "The twist"
  about_title: "Every line starts equal — a few become Express"
  about_body1: >
    Stations bloom across a real city and passengers gather, each one wanting a station shaped
    like its destination. You draw the lines, put trains on them, and route the crowd. A station
    left overcrowded past its timer ends the run; reach the delivery target and the level is won
    on the spot.
  about_body2: >
    The choice that decides a run is which line earns the Express upgrade — faster, higher
    capacity, drawn in a black-and-yellow hazard casing. Express slots are scarce: one on the
    easier levels, two on the hardest. Feed the upgraded line with the rest of your network,
    and turn a busy station into a hub to smooth the transfers.
  feat_label: "Features"
  feat_title: "Built to be read at a glance"
  feat1_title: "A 20-city campaign"
  feat1_body: "From Lyon to Tokyo, each city with its own geography, water and rising difficulty. Every completed level earns a network-satisfaction note from 1 to 100 — replay to beat your best."
  feat2_title: "Maps mode"
  feat2_body: "12 country packs and 117 quick-play cities, an endless score chase with a high score per city."
  feat3_title: "One-handed and minimalist"
  feat3_body: "Drag to draw, pinch to zoom, long-press to edit. A light transit-map look meant to be read in a glance, in short sessions."
  feat4_title: "Offline, six languages"
  feat4_body: "Plays fully offline. English, French, Spanish, German, Italian and Portuguese. No ads, no tracking, no account."
  maps_label: "Maps mode"
  maps_title: "The whole world map, a pack at a time"
  maps_body: >
    Maps is the open-ended half: pick a country pack, pick a city, and play an endless run for
    the highest passenger count. 117 cities, each with its own difficulty.
  maps_price: >
    Brazil and Italy are free, and every player gets two more unlocks on the house. After that a
    pack is a small one-time purchase, or you can unlock every pack at once — present and future.

  shots_label: "Screenshots"
  shot1_alt: "Paris on day 12 — four lines, one upgraded to Express in its black-and-yellow casing, and a network satisfaction of 88."
  shot2_alt: "San Francisco — water on every side, and a network shaped by the bay."
  shot3_alt: "Rome — a dense centre worked through three interchange hubs."
  shot4_alt: "The campaign list — seven cities finished, the next one open, the rest still locked."
  shot5_alt: "Maps packs — Brazil and Italy free from the start, the rest one tap from unlocking."
  store_status: "In closed testing — the Play listing opens to everyone once the review clears."
citytransport_privacy:
  label: "Legal"
  title: "Privacy Policy"
  meta: "City Transport — Ygar Studio — Last updated: September 2026"
  intro: >
    City Transport is a single-player game that runs offline. We collect no personal data, show
    no advertising, and use no analytics. The only network traffic the game makes on its own is
    Google Play Billing, when you buy a country pack.
  s1_title: "1. Who we are"
  s1_body: >
    City Transport is published by Ygar Studio, an independent developer.
    For any privacy-related question, contact us at
  s2_title: "2. Data we do not collect"
  s2_intro: "Ygar Studio does not collect, store, or share any of the following:"
  s2_li1: "Personal identity information (name, email, phone number)"
  s2_li2: "Location data"
  s2_li3: "Device identifiers or advertising IDs"
  s2_li4: "Usage analytics or crash reports sent to our servers"
  s2_li5: "In-app behaviour or gameplay telemetry"
  s3_title: "3. Data stored on your device"
  s3_body: >
    Campaign completions and satisfaction notes, Maps high scores, which country packs are
    unlocked, and your settings are saved
    <strong>only on your device</strong>, in the app's private storage. If you have Android
    <strong>Auto Backup</strong> enabled, Android may copy that save to your own Google account so
    it can be restored when you reinstall — that is handled by Android under your own account
    settings, and the developer never receives or accesses it.
  s4_title: "4. In-app purchases"
  s4_body: >
    Some Maps country packs can be unlocked with a one-time purchase. Purchases are handled
    <strong>entirely by Google Play Billing</strong>: your payment details go to Google, never to
    us. The app asks Google Play which products your Google account owns, so it can unlock them
    again after a reinstall or on another device, and stores only that answer — a list of unlocked
    packs — on your device. We receive no payment information and no personal data from Google
    beyond Play's own aggregated sales reports.
  s5_title: "5. Permissions"
  s5_body: >
    The app itself declares two permissions: <strong>Vibrate</strong>, for in-game haptic feedback,
    and <strong>com.android.vending.BILLING</strong>, for the purchases above. The Google Play
    Billing library adds <strong>Internet</strong> and <strong>Network state</strong> to the built
    app, because reaching Play's payment servers needs them. Nothing else in the game uses the
    network: no gameplay data, no analytics and no personal data is ever sent anywhere.
  s6_title: "6. Children's privacy"
  s6_body: "City Transport does not knowingly collect data from children under 13. It contains no user-generated content, no chat, no advertising and no account. It does contain optional in-app purchases, handled by Google Play."
  s7_title: "7. Third-party services"
  s7_body: "The game embeds no analytics SDKs, advertising networks, crash-reporting services or cloud services. Google Play Billing is the only third-party service it talks to, and only when you make a purchase."
  s8_title: "8. Data deletion"
  s8_body: "All data is local. Uninstalling the app erases everything, including the Auto Backup copy, per Android's rules. There is nothing held on our side, so there is nothing to request deletion of."
  s9_title: "9. Contact"

solitaire:
  page_title: "Ygar Solitaire"
  label: "Card Game · Android"
  tagline1: "Four classic solitaires, one calm table."
  tagline2: "Seeded deals. Unlimited undo. No ads, ever."
  cta: "Get it on Google Play"
  hero_note: >
    Tap a card to send it to its best spot, or drag it exactly where you want. Every deal has a
    seed you can replay and share, undo is unlimited, and a hint is always one tap away.
  variants_label: "The four variants"
  variants_title: "One engine, four classic games"
  klondike_name: "Klondike"
  klondike_tagline: "The classic among classics"
  klondike_body: >
    Build the four foundations up from Ace to King. Empty columns take only a King, and a
    descending, alternating-colour run moves as one.
  klondike_options: "Draw 1 or draw 3 · unlimited, 3, 1 or 0 redeals"
  spider_name: "Spider"
  spider_tagline: "Eight runs, two decks"
  spider_body: >
    Two decks, ten columns. Assemble eight King-to-Ace same-suit runs; only a same-suit,
    descending sequence moves as a group.
  spider_options: "1, 2 or 4 suits"
  freecell_name: "FreeCell"
  freecell_tagline: "Every card visible, every move yours"
  freecell_body: >
    Every card is dealt face-up from the start. Four free cells each hold a card, and proper
    supermoves shift a whole run at once.
  freecell_options: "Near-every deal is winnable — no options to tune"
  pyramid_name: "Pyramid"
  pyramid_tagline: "Pairs that make thirteen"
  pyramid_body: >
    Clear the 28-card pyramid by pairing exposed cards that sum to thirteen — a King is removed
    alone.
  pyramid_options: "2, 1 or 0 redeals"
  seed_label: "Seeded deals"
  seed_title: "Every deal is a number you can share"
  seed_body1: >
    Every deal is shown as a seed, like #123456. The same variant, options and seed always
    reproduce the exact same deal — replay it, or send the number to a friend to compare runs.
  seed_body2: >
    New deal picks a fresh seed at random; Restart re-deals the same one. Nothing is hidden —
    every shuffle in the game goes through that one seed.
  feat_label: "Features"
  feat_title: "Built with care"
  feat1_title: "Unlimited undo"
  feat1_body: "Take back any move, all the way to the deal. Redo brings it right back — free, with no penalty and no limit."
  feat2_title: "A hint that's always fair"
  feat2_body: "The Hint button shows one legal move, straight from the same rules the engine plays by — no solver, no penalty, no cooldown."
  feat3_title: "Auto-finish"
  feat3_body: "Once the win is certain, Auto-finish plays out the rest of the hand in one cascade."
  feat4_title: "Your own records"
  feat4_body: "Win rate, best time, fewest moves and streaks, tracked separately for every variant and its options."
  feat5_title: "Resumes exactly"
  feat5_body: "Close the app mid-hand and come back to the same board, the same undo history, the same score."
  feat6_title: "Four table themes, colour-blind friendly"
  feat6_body: "Pick emerald, navy, burgundy or graphite in Settings; suits are drawn as shapes, and an optional four-colour deck tells them apart even faster."
  free_label: "What it costs"
  free_title: "Free. Actually free."
  free_body1: >
    No ads, no in-app purchases, no paid version — ever. Ygar Solitaire is free forever; the
    studio's goal is a game worth your time, not your wallet.
  free_body2: "No account, no sign-in, nothing to connect. Every deal runs entirely on your device."

  shots_label: "Screenshots"
  shot1_alt: "Klondike mid-hand on the emerald table, with the seed and score in the top bar."
  shot2_alt: "Spider — two decks dealt across ten columns."
  shot3_alt: "FreeCell — every card face-up from the deal, four free cells above."
  shot4_alt: "Pyramid — clear the pyramid by pairing exposed cards that sum to thirteen."
  shot5_alt: "The menu — the four variants, a seed to replay and the how-to-play guide."
  shot6_alt: "Settings — table theme, four-colour deck, reduced motion and left-hand mode."
  store_status: "Not on Google Play yet — the listing goes live at launch."
solitaire_privacy:
  label: "Legal"
  title: "Privacy Policy"
  meta: "Ygar Solitaire — Ygar Studio — Last updated: July 2026"
  intro: >
    Ygar Solitaire is a single-player game that runs entirely offline. We collect no personal
    data, show no advertising, and use no analytics.
  s1_title: "1. Who we are"
  s1_body: >
    Ygar Solitaire is published by Ygar Studio, an independent developer.
    For any privacy-related question, contact us at
  s2_title: "2. Data we do not collect"
  s2_intro: "Ygar Studio does not collect, store, or share any of the following:"
  s2_li1: "Personal identity information (name, email, phone number)"
  s2_li2: "Location data"
  s2_li3: "Device identifiers or advertising IDs"
  s2_li4: "Usage analytics or crash reports sent to our servers"
  s2_li5: "In-app behaviour or gameplay telemetry"
  s2_li6: "Camera, microphone, contacts or files outside the app's own storage"
  s3_title: "3. Data stored on your device"
  s3_body: >
    Game progress — statistics, settings, and the interrupted game with its seed — is stored
    only on your device, in the app's private storage. It is removed when you uninstall the app
    or clear its data. It never leaves your device.
  s4_title: "4. Network access"
  s4_body: "Ygar Solitaire works fully offline and makes no network calls. The app does not request the Internet permission."
  s5_title: "5. Permissions"
  s5_body: >
    The app declares a single permission: Vibrate, used only for the haptic tick on card pickup,
    placement and illegal moves. It requests no other permission — not location, not storage,
    not network.
  s6_title: "6. Children's privacy"
  s6_body: "Ygar Solitaire does not knowingly collect data from children under 13. It contains no advertising, no purchases, no chat and no account, and is suitable for all ages."
  s7_title: "7. Third-party services"
  s7_body: "The game embeds no analytics SDKs, advertising networks, crash-reporting services or cloud services of any kind."
  s8_title: "8. Changes to this policy"
  s8_body: >
    If a future version changes any of the above — for example an optional cloud save — this
    policy will be updated first and the change listed in the app's release notes.
  s9_title: "9. Contact"
